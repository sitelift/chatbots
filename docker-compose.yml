services:
  sitelift:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3000}
      HOST: ${HOST:-0.0.0.0}
      DATABASE_PATH: ${DATABASE_PATH:-data/sitelift.db}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    volumes:
      - sitelift-data:/app/data
    restart: unless-stopped

volumes:
  sitelift-data:
